<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>UI v2 原型 — 48G × 坂道 排序站</title>
    <!--
      原型问题：48G × 坂道排序站 v2 应采用哪种「页面结构 + 视觉」？
      4 个变体经 ?variant=magazine|dark|minimal|sticker 切换（也可用底栏 ← → 或键盘方向键）。
      throwaway 原型：不进入生产代码；选定后按 prototype 技能折叠进正式实现。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Public+Sans:wght@400;500;700&family=Outfit:wght@300;400;600;800&family=Work+Sans:wght@300;400;500;600&family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-size: 14px;
        line-height: 1.55;
      }
      img {
        display: block;
      }
      .ph {
        display: block;
        overflow: hidden;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-ph {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        font-weight: 800;
      }
      .switcher {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 2px;
        z-index: 99;
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 5px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        font-family: "Public Sans", sans-serif;
      }
      .switcher button {
        background: none;
        border: 0;
        color: #fff;
        font-size: 16px;
        padding: 6px 13px;
        cursor: pointer;
      }
      .switcher span {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        padding: 0 6px;
        white-space: nowrap;
      }
      .wrap {
        max-width: 430px;
        margin: 0 auto;
        padding: 18px 16px 96px;
      }

      /* ============ A · 杂志编排 ============ */
      body[data-variant="magazine"] {
        background: #f8f4ec;
        color: #17130e;
        font-family: "Public Sans", "Noto Sans SC", sans-serif;
      }
      [data-variant="magazine"] .kicker {
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #c8102e;
      }
      [data-variant="magazine"] h1 {
        font-family: "Playfair Display", "Noto Serif SC", serif;
        font-weight: 900;
        font-size: 40px;
        line-height: 1.04;
        margin: 6px 0 4px;
      }
      [data-variant="magazine"] h1 em {
        font-style: italic;
        font-weight: 500;
        color: #c8102e;
      }
      [data-variant="magazine"] .issue {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #6b6157;
        border-bottom: 3px double #17130e;
        padding-bottom: 12px;
      }
      .m-tabs {
        display: flex;
        gap: 16px;
        margin-top: 14px;
        border-bottom: 1.5px solid #17130e;
      }
      .m-tabs button {
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: none;
        border: 0;
        padding: 6px 0;
        cursor: pointer;
        color: #6b6157;
        border-bottom: 3px solid transparent;
      }
      .m-tabs button.on {
        color: #17130e;
        border-color: #c8102e;
      }
      .m-size {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 12px 0 22px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6b6157;
      }
      .m-size button {
        font: inherit;
        font-weight: 700;
        background: none;
        border: 0;
        cursor: pointer;
        color: #6b6157;
        padding: 0;
        border-bottom: 2px solid transparent;
      }
      .m-size button.on {
        color: #17130e;
        border-color: #17130e;
      }
      .m-sec {
        margin-bottom: 34px;
      }
      .m-sec > h2 {
        font-family: "Playfair Display", "Noto Serif SC", serif;
        font-size: 22px;
        border-bottom: 1.5px solid #17130e;
        padding-bottom: 6px;
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .m-picks {
        list-style: none;
        columns: 2;
        gap: 18px;
        font-family: "Noto Serif SC", serif;
        margin-bottom: 12px;
      }
      .m-picks li {
        break-inside: avoid;
        padding: 5px 0;
        border-bottom: 1px solid #d8cfc0;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .m-picks b {
        font-family: "Playfair Display", serif;
        color: #c8102e;
        font-size: 15px;
      }
      .m-card {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #d8cfc0;
        cursor: pointer;
        background: none;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        text-align: left;
        font: inherit;
        color: inherit;
        width: 100%;
      }
      .m-card .ph {
        aspect-ratio: 3 / 4;
        border: 1.5px solid #17130e;
      }
      .m-card .idx {
        font-family: "Playfair Display", serif;
        font-size: 13px;
        color: #6b6157;
      }
      .m-card h4 {
        font-family: "Noto Serif SC", serif;
        font-size: 18px;
        font-weight: 700;
        margin: 2px 0 4px;
      }
      .m-card[aria-pressed="true"] {
        background: #f1e9da;
        outline: 2px solid #c8102e;
        outline-offset: 4px;
      }
      .m-group {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6b6157;
        margin: 18px 0 4px;
      }
      .m-duel {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        border-top: 3px double #17130e;
        border-bottom: 3px double #17130e;
        padding: 14px 0;
      }
      .m-duel .fighter {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        text-align: center;
      }
      .m-duel .fighter .ph {
        aspect-ratio: 3 / 4;
        border: 1.5px solid #17130e;
        margin-bottom: 6px;
      }
      .m-duel .fighter span {
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
      }
      .m-duel .vs {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: #c8102e;
        font-size: 20px;
      }
      .m-cta {
        width: 100%;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        background: #c8102e;
        color: #f8f4ec;
        border: 0;
        padding: 12px;
        cursor: pointer;
      }
      .m-result li {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 10px;
        align-items: baseline;
        padding: 9px 0;
        border-bottom: 1px solid #17130e;
      }
      .m-result b {
        font-family: "Playfair Display", serif;
        font-size: 20px;
        font-weight: 900;
      }
      .m-result li:first-child b {
        color: #c8102e;
      }
      .m-result span {
        display: grid;
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
      }
      .m-result small {
        font-family: "Public Sans", sans-serif;
        font-weight: 400;
        color: #6b6157;
      }
      .m-poster {
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), 1fr);
        gap: 3px;
        background: #17130e;
        padding: 8px;
        border: 1.5px solid #17130e;
        margin-top: 16px;
      }
      .m-poster .cell {
        position: relative;
        background: #f8f4ec;
      }
      .m-poster .cell .ph {
        aspect-ratio: 3 / 4;
      }
      .m-poster .cell .pnm {
        font-family: "Noto Serif SC", serif;
        font-size: 9px;
        font-weight: 700;
        text-align: center;
        padding: 3px 2px;
      }
      .m-poster .rk {
        position: absolute;
        top: 0;
        left: 0;
        font-family: "Playfair Display", serif;
        font-size: 12px;
        font-weight: 900;
        background: #17130e;
        color: #f8f4ec;
        padding: 1px 6px;
      }
      .m-poster .rk.r1 {
        background: #c8102e;
      }

      /* ============ B · 暗色舞台 ============ */
      body[data-variant="dark"] {
        background:
          radial-gradient(
            60% 30% at 20% 0%,
            rgba(167, 139, 250, 0.25),
            transparent 70%
          ),
          radial-gradient(
            45% 25% at 90% 4%,
            rgba(34, 211, 238, 0.16),
            transparent 70%
          ),
          #0b0b12;
        color: #f2f2f7;
        font-family: "Outfit", "Noto Sans SC", sans-serif;
      }
      [data-variant="dark"] h1 {
        font-weight: 800;
        font-size: 34px;
      }
      [data-variant="dark"] h1 em {
        font-style: normal;
        background: linear-gradient(90deg, #a78bfa, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .s-tabs {
        display: flex;
        gap: 8px;
        margin: 16px 0 10px;
      }
      .s-tabs button,
      .s-size button {
        font: inherit;
        font-weight: 700;
        padding: 7px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #9a9aae;
        cursor: pointer;
      }
      .s-tabs button.on {
        background: linear-gradient(90deg, #a78bfa, #22d3ee);
        color: #0b0b12;
        border-color: transparent;
      }
      .s-size {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .s-size button.on {
        background: #f2f2f7;
        color: #0b0b12;
        border-color: transparent;
      }
      .s-lineup {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(11, 11, 18, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 10px 12px;
        margin-bottom: 18px;
      }
      .s-lineup p {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9a9aae;
        display: flex;
        justify-content: space-between;
      }
      .s-lineup b {
        color: #22d3ee;
      }
      .s-lineup ul {
        list-style: none;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        margin-top: 8px;
      }
      .s-lineup li {
        flex: 0 0 auto;
        width: 44px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .s-lineup .empty {
        width: 44px;
        height: 58px;
        display: grid;
        place-items: center;
        font-size: 10px;
        color: #9a9aae;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: 8px;
      }
      .s-rail {
        margin-bottom: 22px;
      }
      .s-rail h3 {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #f2f2f7;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
      }
      .s-rail h3 span {
        color: #9a9aae;
        font-weight: 500;
      }
      .s-films {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 6px;
        scroll-snap-type: x mandatory;
      }
      .s-films .card {
        flex: 0 0 auto;
        width: 118px;
        scroll-snap-align: start;
        background: #15151f;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        padding: 0 0 8px;
        cursor: pointer;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .s-films .card[aria-pressed="true"] {
        border-color: rgba(167, 139, 250, 0.75);
        box-shadow: 0 6px 22px rgba(167, 139, 250, 0.3);
      }
      .s-films .ph {
        aspect-ratio: 3 / 4;
      }
      .s-films .nm {
        display: block;
        font-weight: 700;
        font-size: 13px;
        padding: 6px 8px 0;
      }
      .s-films .meta {
        display: block;
        font-size: 10px;
        color: #9a9aae;
        padding: 0 8px;
      }
      .s-duel {
        background: #15151f;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 26px;
      }
      .s-duel .bar {
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        margin: 8px 0 16px;
      }
      .s-duel .bar i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a78bfa, #22d3ee);
      }
      .s-arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
      }
      .s-arena .fighter {
        font: inherit;
        color: inherit;
        text-align: center;
        background: radial-gradient(
          80% 60% at 50% 20%,
          rgba(167, 139, 250, 0.25),
          transparent 70%
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 10px 10px 14px;
        cursor: pointer;
      }
      .s-arena .ph {
        aspect-ratio: 3 / 4;
        border-radius: 10px;
      }
      .s-arena span {
        display: block;
        margin-top: 10px;
        font-weight: 700;
      }
      .s-arena .vs {
        font-weight: 800;
        background: linear-gradient(90deg, #a78bfa, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .s-result {
        margin-bottom: 22px;
      }
      .s-podium {
        display: grid;
        grid-template-columns: 1fr 1.25fr 1fr;
        gap: 8px;
        align-items: end;
        margin-bottom: 16px;
      }
      .s-podium .pod {
        text-align: center;
        background: #15151f;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px 12px 0 0;
        padding: 10px 6px;
      }
      .s-podium .pod .ph {
        aspect-ratio: 3 / 4;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .s-podium .pod b {
        font-size: 20px;
        font-weight: 800;
        color: #f5c518;
      }
      .s-podium .pod:nth-child(2) {
        padding-top: 22px;
        border-color: rgba(245, 197, 24, 0.5);
      }
      .s-result li {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .s-result li b {
        color: #9a9aae;
        font-weight: 800;
      }
      .s-result span {
        display: grid;
        font-weight: 700;
      }
      .s-result small {
        color: #9a9aae;
        font-weight: 400;
      }
      .s-poster {
        display: grid;
        grid-template-columns: repeat(var(--cols, 4), 1fr);
        gap: 4px;
        padding: 10px;
        background: #06060a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        margin-top: 14px;
      }
      .s-poster .cell {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background: #15151f;
      }
      .s-poster .cell .ph {
        aspect-ratio: 3 / 4;
      }
      .s-poster .cell .pnm {
        font-size: 9px;
        text-align: center;
        padding: 4px 2px;
      }
      .s-poster .rk {
        position: absolute;
        top: 4px;
        left: 4px;
        font-size: 11px;
        font-weight: 800;
        color: #0b0b12;
        background: #9a9aae;
        border-radius: 6px;
        padding: 1px 6px;
      }
      .s-poster .rk.r1 {
        background: #f5c518;
      }

      /* ============ C · 明亮极简 ============ */
      body[data-variant="minimal"] {
        background: #fff;
        color: #111827;
        font-family: "Work Sans", "Noto Sans SC", sans-serif;
      }
      [data-variant="minimal"] h1 {
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      [data-variant="minimal"] h1 em {
        font-style: normal;
        color: #2563eb;
      }
      .n-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      .n-tabs {
        display: flex;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }
      .n-tabs button {
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 7px 14px;
        background: none;
        border: 0;
        cursor: pointer;
        color: #6b7280;
      }
      .n-tabs button + button {
        border-left: 1px solid #e5e7eb;
      }
      .n-tabs button.on {
        background: #2563eb;
        color: #fff;
      }
      .n-search {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 2px solid #111827;
        padding: 12px 0 10px;
        margin-bottom: 6px;
      }
      .n-search input {
        flex: 1;
        font: inherit;
        font-size: 17px;
        border: 0;
        outline: none;
        background: none;
      }
      .n-search em {
        font-style: normal;
        font-size: 12px;
        color: #6b7280;
      }
      .n-sizes {
        display: flex;
        gap: 6px;
        padding: 12px 0 18px;
      }
      .n-sizes button {
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 13px;
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        background: none;
        color: #6b7280;
        cursor: pointer;
      }
      .n-sizes button.on {
        border-color: #111827;
        color: #111827;
      }
      .n-tray {
        font-size: 12px;
        color: #6b7280;
        display: flex;
        justify-content: space-between;
        padding: 0 0 14px;
      }
      .n-tray b {
        color: #111827;
      }
      .n-group {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #6b7280;
        margin: 20px 0 6px;
      }
      .n-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 8px 0;
        border: 0;
        border-bottom: 1px solid #f3f4f6;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .n-row .ph {
        width: 40px;
        height: 52px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        flex: 0 0 auto;
      }
      .n-row .nm {
        font-weight: 500;
      }
      .n-row .meta {
        font-size: 11px;
        color: #6b7280;
        display: block;
      }
      .n-row .add {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid #e5e7eb;
        display: grid;
        place-items: center;
        font-size: 15px;
        color: #6b7280;
      }
      .n-row[aria-pressed="true"] .add {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .n-duel {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        margin: 24px 0;
      }
      .n-duel .bar {
        height: 3px;
        background: #e5e7eb;
        border-radius: 999px;
        margin: 8px 0 16px;
      }
      .n-duel .bar i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: #2563eb;
      }
      .n-arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
      }
      .n-arena .fighter {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: center;
      }
      .n-arena .fighter:hover {
        border-color: #2563eb;
      }
      .n-arena .ph {
        aspect-ratio: 3 / 4;
        border-radius: 6px;
      }
      .n-arena .pick {
        display: block;
        margin-top: 8px;
        font-size: 12px;

            ${duelHTML("n-arena", "pick")}
            <p style="font-size:12px;color:#6b7280;margin-top:10px">点整张卡片即选中；也可用键盘 1 / 2</p></section>
          <section class="n-result"><h3 style="font-size:13px;color:#6b7280;letter-spacing:.12em">结果</h3>
            <table class="n-table">${data()
              .slice(0, 5)
              .map(
                (m, i) =>
                  `<tr><td>${i + 1}</td><td>${m.name}</td><td style="text-align:right;color:#6b7280">${meta(m)}</td></tr>`
              )
              .join("")}</table>
            ${poster("n-poster")}
            <p class="n-note">海报尺寸 1080×1440 · 32 人为 8×4 网格</p>
          </section>`;
        },
        sticker() {
          return `
          <h1>48 Group <em>×</em> 坂道</h1>
          ${seriesTabs("k-chips")}
          ${sizeButtons("k-chips")}
          <div class="k-tray"><p><span>贴纸板</span><b>${state.selected.length} / ${state.size}</b></p>
            <ul>${Array.from({ length: state.size }, (_, i) => {
              const m = data().find((x) => key(x) === state.selected[i]);
              return m
                ? `<li>${trayIcon(m)}</li>`
                : `<li class="empty">${i + 1}</li>`;
            }).join("")}</ul></div>
          <section class="k-bento">${groups()
            .flatMap((g) => g.items)
            .slice(0, 12)
            .map(
              (
                m,
                i
              ) => `<button class="k-tile ${i % 5 === 0 ? "big" : ""}" data-member="${key(m)}" aria-pressed="${on(m)}">
                <span class="chip">${m.gen}</span>${photo(m)}<span><h4>${m.name}</h4><span class="meta">${m.group} · ${meta(m)}</span></span>
              </button>`
            )
            .join("")}</section>
          <section class="k-duel"><div class="k-arena">${duelHTML("k-arena", "")
            .replace('class="k-arena"', "")
            .replace(
              /^<div[^>]*>|<\/div>$/g,
              ""
            )}</div><p style="text-align:center;font-family:Nunito;font-weight:900;margin-top:10px;color:#6f6a60">点一张贴纸 = 选她 · 第 12 / 29 题</p></section>
          <section class="k-result"><h3 style="font-family:Nunito;font-weight:900;margin-bottom:10px">榜单贴纸</h3>
            <ol style="list-style:none">${data()
              .slice(0, 4)
              .map(
                (m, i) =>
                  `<li><b>${i + 1}</b><span>${m.name}<small>${meta(m)}</small></span></li>`
              )
              .join("")}</ol>
            ${poster("k-poster")}
          </section>`;
        },
      };

      const app = document.getElementById("app");
      const label = document.getElementById("vlabel");
      const paint = () => {
        document.body.dataset.variant = state.variant;
        app.innerHTML = renders[state.variant]();
        label.textContent = VARIANTS.find((v) => v[0] === state.variant)[1];
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        history.replaceState(null, "", url);
      };
      const step = (d) => {
        const i = VARIANTS.findIndex((v) => v[0] === state.variant);
        state.variant =
          VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0];
        paint();
      };
      document.getElementById("prev").addEventListener("click", () => step(-1));
      document.getElementById("next").addEventListener("click", () => step(1));
      addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea, [contenteditable]")) return;
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
      });
      app.addEventListener("click", (e) => {
        const series = e.target.closest("[data-series]");
        if (series) {
          state.series = series.dataset.series;
          state.selected = state.selected.filter((id) =>
            data().some((m) => key(m) === id)
          );
          return paint();
        }
        const size = e.target.closest("[data-size]");
        if (size) {
          state.size = Number(size.dataset.size);
          state.selected = state.selected.slice(0, state.size);
          return paint();
        }
        const card = e.target.closest("[data-member]");
        if (card) {
          const id = card.dataset.member;
          const i = state.selected.indexOf(id);
          if (i >= 0) state.selected.splice(i, 1);
          else if (state.selected.length < state.size) state.selected.push(id);
          return paint();
        }
      });
      const initial = new URLSearchParams(location.search).get("variant");
      if (VARIANTS.some((v) => v[0] === initial)) state.variant = initial;
      paint();
    </script>
  </body>
</html>
