name: check

# 仓库的提交闸门（retro 2026-10-06）。本机跑不了钩子（/mnt/sdcard 是 FUSE 挂载、
# husky 的 pre-commit 没有可执行位 → git 直接跳过），所以闸门一直是「agent 记得跑
# `npm run check`」——本仓为此付过两次红闸门提交。CI 把它变成机制。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # lizard：复杂度棘轮（npm run complexity）的 Python 侧扫描器 —— 缺了它
      # `npm run check` 会以「lizard 跑不起来」exit 2（CI 第一次真跑就是这么红的）
      - run: python3 -m pip install --user Pillow lizard
      # eslint：no-undef 闸门（lint:undef）。版本与本地一致，结果确定性 ——
      # 它抓到过真缺陷（e2e-v5 的 errs 未定义，首个 console 错误即崩套件）
      - run: npm i --no-save eslint@6.4.0
      - run: npm run check

  e2e:
    # E2E 是 UI 层唯一的验收手段（app.js 没有单测缝），也放进来。
    # 2026-10-08 订正：全量 `e2e:all`（五个套件）在 runner 上**挂住超过 2 小时**
    # （此前主套件约 3.5 分钟）——「5–7 分钟」的估算只在本地成立。先回到三个已验证的
    # 快速套件（主 + v5 + pwa），两个矩阵套件（header/first）的 runner 成本待诊断
    # （见检查点第七十轮）；本地仍跑全量 `npm run e2e:all`。
    # timeout 兜底：慢或挂住时**可见地失败**，不再无声地占住闸门。
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm i --no-save playwright # 只为让 require("playwright") 能解析；不动 lock
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install --user Pillow
      - run: npm run e2e
      - run: npm run e2e:v5
      - run: npm run e2e:pwa
