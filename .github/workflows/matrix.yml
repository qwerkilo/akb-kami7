name: matrix

# 矩阵套件（页头 73 态 / 首屏 145 态）单独每晚跑 + 手工可触发：它们要挡的是
# 视觉/布局漂移，不是每次提交。旧注释里的「runner 慢 10–20× / >2h」是 2026-10-08
# 一次五套件全量并发的推断，已被 2026-10-30 的 step 级实测推翻（见
# .scratch/perf-load/research/05-ci-e2e-load.md）；当前 job 成本以那份研究为准。
# 失败 = job 红；不阻塞 push，也不自动开 issue。
on:
  schedule:
    - cron: "0 18 * * *" # 北京 02:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-1.62.1
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:header
      - run: npm run e2e:first
