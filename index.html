<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="doc_title">
      48 Group × 坂道 好き顔ソート（历代成员）
    </title>
    <meta
      name="description"
      content="从 48 Group 与坂道的历代成员（含毕业成员）里选出最喜欢的 7 / 16 / 32 张脸，两两比较排出名次，生成你的神7 / 7福神图片。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
    />
    <script>
      try {
        var s = localStorage.getItem("akb:skin");
        if (s === "sticker" || s === "classic")
          document.documentElement.dataset.skin = s;
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-main">
        <p class="eyebrow" id="eyebrow">48 Group 好き顔ソート</p>
        <h1>
          <span class="kami" id="brand">神7</span
          ><span class="sub" data-i18n="subtitle">历代成员版</span>
        </h1>
        <div
          class="seg seg-series"
          role="radiogroup"
          data-i18n-aria-label="series_label"
        >
          <button
            type="button"
            role="radio"
            aria-checked="true"
            data-series="48g"
          >
            48 Group
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-series="sakamichi"
          >
            坂道</button
          ><button
            type="button"
            role="radio"
            aria-checked="false"
            data-series="love"
          >
            等爱
          </button>
        </div>
      </div>
      <div class="masthead-side">
        <div
          class="seg seg-lang"
          role="radiogroup"
          data-i18n-aria-label="lang_label"
        >
          <button type="button" role="radio" aria-checked="true" data-lang="zh">
            中
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-lang="en"
          >
            EN
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-lang="ja"
          >
            日
          </button>
        </div>
        <div
          class="seg seg-skin"
          role="radiogroup"
          data-i18n-aria-label="skin_label"
        >
          <button
            type="button"
            role="radio"
            aria-checked="true"
            data-skin="classic"
          >
            <span class="swatch classic" aria-hidden="true"></span
            ><span data-i18n="skin_classic">原版</span>
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-skin="sticker"
          >
            <span class="swatch sticker" aria-hidden="true"></span
            ><span data-i18n="skin_sticker">贴纸</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="steps" id="steps" data-i18n-aria-label="steps_label">
      <button type="button" data-step="pick" aria-current="step">
        <span class="step-no" aria-hidden="true">1</span
        ><span data-i18n="step_pick">挑人</span>
        <b id="step-pick-n">0/7</b>
      </button>
      <span class="steps-sep" aria-hidden="true">›</span>
      <button type="button" data-step="duel" disabled>
        <span class="step-no" aria-hidden="true">2</span
        ><span data-i18n="step_duel">对决</span>
        <b id="step-duel-n" hidden></b>
      </button>
      <span class="steps-sep" aria-hidden="true">›</span>
      <button type="button" data-step="result" disabled>
        <span class="step-no" aria-hidden="true">3</span
        ><span data-i18n="step_result">出图</span>
      </button>
    </nav>

    <main>
      <!-- 1. pick -->
      <section id="phase-pick" class="phase">
        <div class="coach" id="coach" hidden>
          <div class="coach-txt">
            <b id="coach-title"></b>
            <p id="coach-body"></p>
          </div>
          <button
            type="button"
            class="ghost"
            data-act="coach-ok"
            data-i18n="coach_ok"
          >
            知道了
          </button>
        </div>
        <div class="resume" id="resume-card" hidden>
          <div class="coach-txt">
            <b data-i18n="resume_title">有一场进行中的对决</b>
            <p id="resume-body"></p>
          </div>
          <div class="resume-acts">
            <button
              type="button"
              class="primary"
              data-act="resume-go"
              data-i18n="resume_go"
            >
              继续对决</button
            ><button
              type="button"
              class="ghost"
              data-act="resume-drop"
              data-i18n="resume_drop"
            >
              放弃
            </button>
          </div>
        </div>
        <div class="pick-progress" id="pick-progress">
          <span class="ring-wrap" id="pick-ring" aria-hidden="true"></span>
          <div class="pick-cov" id="pick-cov"></div>
        </div>
        <div class="toolbar">
          <div
            class="seg seg-size"
            role="radiogroup"
            data-i18n-aria-label="size_label"
          >
            <button role="radio" aria-checked="true" data-pick="7" id="size-7">
              神7
            </button>
            <button
              role="radio"
              aria-checked="false"
              data-pick="16"
              data-i18n="mode_16"
            >
              16人版
            </button>
            <button
              role="radio"
              aria-checked="false"
              data-pick="32"
              data-i18n="mode_32"
            >
              32人版
            </button>
          </div>
          <div
            class="seg seg-filter"
            role="radiogroup"
            data-i18n-aria-label="filter_label"
          >
            <button
              role="radio"
              aria-checked="true"
              data-filter="all"
              data-i18n="filter_all"
            >
              全部
            </button>
            <button
              role="radio"
              aria-checked="false"
              data-filter="current"
              data-i18n="filter_current"
            >
              现役
            </button>
            <button
              role="radio"
              aria-checked="false"
              data-filter="former"
              data-i18n="filter_former"
            >
              已毕业
            </button>
          </div>
          <label class="group-pick">
            <span class="visually-hidden" data-i18n="group_label">团体</span>
            <select id="group-filter">
              <option value="all" data-i18n="all_groups">全部团体</option>
            </select>
          </label>
          <label class="search">
            <span class="visually-hidden" data-i18n="search_label"
              >搜索成员</span
            >
            <input
              id="search"
              type="search"
              data-i18n-placeholder="search_ph"
              placeholder="搜索名字（汉字/假名/昵称）"
              autocomplete="off"
            />
          </label>
        </div>

        <div id="roster" class="roster" tabindex="-1"></div>

        <div class="tray" id="tray">
          <div class="tray-main">
            <ol
              class="slots"
              id="slots"
              data-i18n-aria-label="slots_label"
            ></ol>
            <p class="tray-hint">
              <span data-i18n="tray_hint">点底部头像即可去掉，再选别人</span>
              <button
                id="clear-btn"
                class="ghost"
                disabled
                data-i18n="clear_pick"
              >
                清空
              </button>
            </p>
          </div>
          <button id="start-btn" class="primary" disabled>还差 7 位</button>
        </div>
      </section>

      <!-- 2. duel -->
      <section id="phase-duel" class="phase" hidden>
        <div class="duel-head">
          <h2 data-i18n="duel_title">更喜欢哪张脸？</h2>
          <p class="duel-progress">
            <span id="duel-step">1</span
            ><span data-i18n="duel_mid"> / 最多 </span
            ><span id="duel-max">14</span><span data-i18n="duel_end"> 题</span>
            <span class="duel-extra" id="duel-extra"></span>
          </p>
          <div class="bar"><i id="duel-bar"></i></div>
          <p class="duel-saved" id="duel-saved">
            <i aria-hidden="true"></i
            ><span data-i18n="duel_saved">进度已自动保存</span>
          </p>
        </div>
        <div class="duel">
          <button class="fighter" id="fighter-a" data-side="0"></button>
          <span class="or" aria-hidden="true">or</span>
          <button class="fighter" id="fighter-b" data-side="1"></button>
        </div>
        <div class="duel-actions">
          <button id="undo-btn" class="ghost" disabled data-i18n="undo">
            撤回上一题
          </button>
          <button id="back-pick-btn" class="ghost" data-i18n="duel_leave">
            保存并返回
          </button>
        </div>
        <p class="hint" data-i18n="keys">键盘可用 ← → 选择，Z 撤回</p>
      </section>

      <!-- 3. result -->
      <section id="phase-result" class="phase" hidden>
        <div class="result-grid">
          <figure class="poster" id="poster">
            <img id="poster-img" alt="我的排名图" data-i18n-alt="poster_alt" />
            <figcaption data-i18n="longpress">
              手机上可以长按图片保存
            </figcaption>
          </figure>
          <div class="result-side">
            <label class="field">
              <span data-i18n="title_label">标题</span>
              <input
                id="title-input"
                type="text"
                maxlength="24"
                value="我的 48 Group 神7"
              />
            </label>
            <ol class="rank-list" id="rank-list"></ol>
            <div class="result-actions">
              <button id="save-btn" class="primary" data-i18n="save">
                保存图片
              </button>
              <button id="share-btn" class="ghost" data-i18n="share">
                分享到 X
              </button>
              <button id="resort-btn" class="ghost" data-i18n="resort">
                这几位重新排序
              </button>
              <button id="restart-btn" class="ghost" data-i18n="reselect">
                重新选人
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="profile" id="profile" hidden>
      <div
        class="profile-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pf-name"
      >
        <button class="pf-close" id="pf-close" data-i18n-aria-label="bio_close">
          ×
        </button>
        <div class="pf-head">
          <img class="pf-photo" id="pf-photo" alt="" />
          <div class="pf-id">
            <h3 id="pf-name"></h3>
            <p class="pf-kana" id="pf-kana"></p>
            <span class="pf-badge" id="pf-badge"></span>
          </div>
        </div>
        <dl class="pf-fields" id="pf-fields"></dl>
      </div>
    </div>

    <footer class="colophon">
      <span data-i18n="credit_1">成员名单与照片来自</span>
      <a href="https://48pedia.org/" target="_blank" rel="noopener"
        >エケペディア（48pedia）</a
      >
      <span data-i18n="credit_2">，版权归原权利人所有。</span>
      <span data-i18n="credit_love"
        >等爱系列：成员资料与照片来自各团体官网与日文 Wikipedia（含 Web Archive
        存档）。灵感来自</span
      >
      <a
        href="https://sahooniduka.github.io/AKB48-Sukigao/"
        target="_blank"
        rel="noopener"
        >AKB48 神7 好き顔ソート</a
      >。
    </footer>

    <div class="duel-intro" id="duel-intro" hidden>
      <div
        class="di-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="di-title"
      >
        <h2 id="di-title" data-i18n="duel_intro_title">开始两两对决</h2>
        <ol class="di-list">
          <li data-i18n="duel_intro_1"></li>
          <li id="di-line2"></li>
          <li data-i18n="duel_intro_3"></li>
        </ol>
        <div class="di-acts">
          <button
            type="button"
            class="primary"
            data-act="intro-go"
            data-i18n="duel_intro_go"
          >
            开始</button
          ><button
            type="button"
            class="ghost"
            data-act="intro-skip"
            data-i18n="duel_intro_skip"
          >
            跳过说明
          </button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <canvas id="poster-canvas" width="1080" height="1440" hidden></canvas>
    <script src="core.js"></script>
    <script src="session.js"></script>
    <script src="poster.js"></script>
    <script src="i18n.js"></script>
    <script src="members.js"></script>
    <script src="simplified.js"></script>
    <script src="app.js"></script>
  </body>
</html>
